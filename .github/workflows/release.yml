name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: tarea-win-x64
          - os: macos-latest
            rid: osx-x64
            artifact: tarea-osx-x64
          - os: macos-latest
            rid: osx-arm64
            artifact: tarea-osx-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: publish
        run: dotnet publish -c Release -r ${{ matrix.rid }} -o publish

      - name: zip (windows)
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path publish/* -DestinationPath ${{ matrix.artifact }}.zip

      - name: zip (macos)
        if: matrix.os == 'macos-latest'
        run: |
          chmod +x publish/Tarea

          # Create .app bundle
          mkdir -p Tarea.app/Contents/MacOS
          mkdir -p Tarea.app/Contents/Resources
          cp publish/* Tarea.app/Contents/MacOS/ 2>/dev/null || true
          cp -R publish/* Tarea.app/Contents/MacOS/ 2>/dev/null || true

          cat > Tarea.app/Contents/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>Tarea</string>
              <key>CFBundleIdentifier</key>
              <string>com.nickyv.tarea</string>
              <key>CFBundleName</key>
              <string>tarea</string>
              <key>CFBundleVersion</key>
              <string>1.0.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundlePackagetype</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>CFBundleIconFile</key>
              <string>icon</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          PLIST

          chmod +x Tarea.app/Contents/MacOS/Tarea
          zip -r ${{ matrix.artifact }}.zip Tarea.app

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*.zip
